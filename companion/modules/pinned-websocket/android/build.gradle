plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pinnedwebsocket'
version = '0.1.0'

android {
  namespace "expo.modules.pinnedwebsocket"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native already ships OkHttp; declaring the same major version here
  // lets us compile against the API without pulling a second copy at runtime.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
