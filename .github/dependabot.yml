# Weekly dependency PRs across every package.json, the Cargo workspace, and
# the GitHub Actions workflows. Major bumps are opt-in only via security
# advisories; the routine queue is minor + patch grouped so it stays
# actionable. A security update that requires a major bump still gets opened
# by Dependabot: `ignore` rules do not apply to security updates.
#
# Directory coverage (post bun-monorepo migration):
#   bun            -> / (workspace root; dependabot walks the workspace tree
#                        and proposes bumps against each member's package.json)
#   bun            -> /apps/companion (separate entry; Expo SDK patches
#                        grouped and allowed, SDK minors and exact-pinned
#                        React Native packages blocked)
#   cargo          -> / (workspace root; picks up src-tauri + xtask)
#   github-actions -> / (all workflows under .github/workflows/)

version: 2

updates:
  # Bun workspace root. Covers apps/desktop, apps/website, and
  # src-tauri/sidecar (all three declared in root package.json workspaces).
  # apps/companion is handled by its own entry below because raw bumps of the
  # exact-pinned Expo-managed packages cross the Hermes ABI boundary and blow
  # up iOS at launch.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  # Companion (Expo React Native). Expo-managed packages must be updated
  # via `expo install` (which respects bundledNativeModules.json), not
  # raw dependabot bumps. Skipping this rule crashes iOS at launch with a
  # dyld "Symbol not found" for a JSI method that the pinned hermesvm
  # xcframework does not export. Android does not hit this because Gradle
  # recompiles Hermes from source; iOS uses a prebuilt xcframework.
  #
  # https://docs.expo.dev/more/glossary-of-terms/#versioned-package
  - package-ecosystem: "bun"
    directory: "/apps/companion"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      # Major bumps opt-in only, as elsewhere.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Expo core and modules track the SDK with tilde ranges (`expo` is
      # `~56.0.22`, `expo-router` is `~56.2.21`), so Expo itself sanctions
      # patch movement inside the pinned SDK minor. Patches are allowed
      # through on that basis while minors stay opt-in, because a minor is an
      # SDK bump and has to be driven by `expo install --fix` so the whole set
      # moves together. Blocking patches too is what let the tree rot behind
      # the SDK selector until `expo install --check` failed on every branch,
      # main included, with no commit to cause it.
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-minor"
      # Exact-pinned by the SDK with no tilde, so no automated bump is safe and
      # these stay fully blocked. `react-native` is pinned to one version
      # because iOS links a prebuilt hermesvm xcframework while Android
      # recompiles Hermes from source, so a version the SDK did not pin crashes
      # iOS at launch with a dyld "Symbol not found" for a JSI method the
      # xcframework does not export.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-*"
      - dependency-name: "@shopify/react-native-*"
    groups:
      # Expo SDK patches ship as a coordinated set, so they get their own group:
      # one PR moves the family together and `expo install --check` in CI
      # ratifies the result. Mixed into the general group, a partial bump would
      # surface as an Expo mismatch instead.
      expo-sdk-patches:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types:
          - "patch"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "companion"

  # Cargo workspace lives at apps/desktop/Cargo.toml and aggregates
  # src-tauri + xtask crates. Dependabot walks the workspace natively so
  # a single entry rooted at the workspace root is enough.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions bumps for release.yml, ci.yml, tap-dispatch.yml. Lower PR
  # cap since the surface area is small.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
