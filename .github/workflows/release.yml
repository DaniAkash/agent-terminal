# Tag-triggered signed + notarized macOS release.
#
# Push a `v*` tag (e.g. `v0.1.0`, `v0.2.0-rc.1`) → this workflow builds
# both per-arch signed + notarized .dmgs in parallel, creates a DRAFT
# GitHub Release for that tag, and attaches both .dmgs.
#
# The release stays in DRAFT state. Review it in the GitHub UI and click
# Publish when ready — never auto-published.
#
# How to cut a release:
#   1. Bump version in apps/desktop/package.json + apps/desktop/src-tauri/tauri.conf.json + apps/desktop/src-tauri/Cargo.toml
#   2. Commit ("chore(release): vX.Y.Z") — the `chore(release)` scope is
#      filtered out by cliff.toml so the version-bump commit doesn't show
#      up in the next release's changelog.
#   3. git tag vX.Y.Z && git push origin main --tags
#   4. Wait ~15 min, then publish the draft from the Releases page
#
# Required repo secrets (settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE                    — base64-encoded Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD           — password for the .p12
#   APPLE_SIGNING_IDENTITY               — full Developer ID Application identity string
#   APPLE_ID                             — Apple ID email
#   APPLE_PASSWORD                       — app-specific password for notarytool
#   APPLE_TEAM_ID                        — Apple Developer team identifier
#   KEYCHAIN_PASSWORD                    — throwaway, unlocks the temp runner keychain
#   TAURI_SIGNING_PRIVATE_KEY            — minisign private key for updater bundles
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — password for the minisign key
#
# All values stored in repo Settings → Secrets and variables → Actions.
# Never inline any of them here, even as examples.

name: Release (signed + notarized per-arch macOS builds)

on:
  push:
    tags:
      # Only semver-style tags trigger releases — `v0.1.0`, `v1.2.3-rc.1`,
      # etc. Loose patterns like `v*` would also match `vnext`, `vendor-fix`,
      # or typo'd tags and silently kick off a notarized build.
      - 'v[0-9]*'

# Read-only by default. The one job that writes (`release`) raises its own
# scope, so a build or changelog job compromised through a dependency cannot
# push a commit or publish a release.
permissions:
  contents: read

jobs:
  linux:
    name: Build Linux release assets
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test AUR metadata generator
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop -> target
      - run: bun install --frozen-lockfile
      - run: bun build apps/desktop/src-tauri/sidecar/index.js --compile --outfile apps/desktop/src-tauri/sidecar/sidecar-bin
      - name: Build AppImage, Debian and RPM packages
        working-directory: apps/desktop
        run: bunx tauri build --config src-tauri/tauri.linux-bundle.conf.json
      - name: Prepare Linux release and Snap project
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          python3 packaging/validate_release_tag.py "$version" "$GITHUB_REF_NAME"
          mkdir -p linux-assets packaging/snap/snap/gui
          deb=$(find apps/desktop/target/release/bundle/deb -name '*.deb' -print -quit)
          image=$(find apps/desktop/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$deb" && test -n "$image"
          cp "$deb" "linux-assets/agent-terminal_${version}_amd64.deb"
          cp "$image" linux-assets/
          cp apps/desktop/target/release/bundle/rpm/*.rpm linux-assets/
          # Version-less copies so `releases/latest/download/<name>` keeps
          # resolving after the next version bump, which is what the README
          # download buttons rely on. The two .dmg files already get this
          # treatment; without it a Linux link works until the next release
          # and then 404s. The versioned names stay for anyone pinning.
          rpm=$(find apps/desktop/target/release/bundle/rpm -name '*.rpm' -print -quit)
          test -n "$rpm"
          cp "$deb" linux-assets/agent-terminal-amd64.deb
          cp "$image" linux-assets/agent-terminal-amd64.AppImage
          cp "$rpm" linux-assets/agent-terminal-x86_64.rpm
          chmod +x "$image"
          image=$(realpath "$image")
          (cd packaging/snap && "$image" --appimage-extract > /dev/null && mv squashfs-root app)
          cp apps/desktop/src-tauri/icons/128x128.png packaging/snap/snap/gui/agent-terminal.png
          sed -i "s/^version: '0.0.0'$/version: '$version'/" packaging/snap/snapcraft.yaml
      - name: Build Snap
        id: snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          path: packaging/snap
      - name: Collect Snap
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
        run: cp "$SNAP_FILE" linux-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundles-linux-x86_64
          path: linux-assets/*
          if-no-files-found: error

  # Job 1: figure out the changelog ONCE, on a free Linux runner, and
  # pass it to the macOS build matrix + final release step via job
  # outputs. Doing it in each matrix entry would duplicate the work and
  # risk cliff drift between them.
  changelog:
    name: Compute changelog
    runs-on: ubuntu-latest
    outputs:
      first_release: ${{ steps.previous_tag.outputs.first_release }}
      # Fallback to the literal "first release" string when changelog
      # step was skipped (very first tag has no ancestor to diff against).
      content: ${{ steps.changelog.outputs.content || 'first release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history is required so git-cliff (and `git describe`) can
          # walk back to the previous tag and compute the changelog range.
          fetch-depth: 0

      - name: Determine previous tag (for changelog range)
        id: previous_tag
        run: |
          # `git describe --tags --abbrev=0 --match 'v[0-9]*' <tag>^`
          # returns the most recent release-style tag *before* <tag>. The
          # `--match` filter ensures only semver-style `v…` tags count, so
          # any non-release tags that ever land on the branch can't hijack
          # the changelog range. For the very first release this errors
          # (no ancestor release tag exists) — we treat that as the
          # "first release" case and short-circuit changelog generation.
          set +e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null)
          set -e
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "first_release=true" >> "$GITHUB_OUTPUT"
            echo "No previous tag found — this is the first release."
          else
            echo "first_release=false" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            echo "Previous tag: $PREVIOUS_TAG"
          fi

      - name: Generate changelog (subsequent releases only)
        if: steps.previous_tag.outputs.first_release == 'false'
        id: changelog
        # git-cliff parses conventional-commit messages between the previous
        # tag and the new tag, groups them by type per cliff.toml, and
        # exposes the rendered markdown as `steps.changelog.outputs.content`.
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --strip header ${{ steps.previous_tag.outputs.previous_tag }}..${{ github.ref_name }}

  # Job 2: build + sign + notarize each macOS arch in parallel. Each
  # matrix entry produces ONE per-arch .dmg; the matching .dmg name
  # contains the arch suffix (Tauri bundler default — `_aarch64` /
  # `_x64`). `fail-fast: false` so a flake on one arch doesn't cancel
  # the other; the `release` job's `needs:` will simply not be
  # satisfied and no draft is created — re-run the failing entry.
  build:
    name: Build ${{ matrix.target }}
    needs: [changelog]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # apps/desktop/.cargo/config.toml moves intermediates to a shared
      # dir so local worktrees share one copy. A release runner is a
      # single ephemeral checkout, and the cache step below plus every
      # bundle path in this workflow are written against target/, so
      # override back to the default layout here.
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/apps/desktop/target
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bun
        # Reads the version from the checked-in `.bun-version` file —
        # bumping Bun is a one-line change to that file, reviewed like any
        # other source change.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          # Cache key carries the target triple so the two matrix entries
          # keep separate caches. Different triples = different compiled
          # artifacts; sharing the cache would just cause misses every time.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-

      - name: Install frontend dependencies
        run: bun install

      - name: Tauri build (signed + notarized)
        # tauri-action handles: cert decode + temp keychain import +
        # `bun tauri build` + signing + notarization + stapling. Skipping
        # `tagName` means the action does NOT create a release itself —
        # the dedicated `release` job below does that, once both matrix
        # entries succeed.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater bundle signing (minisign). Without these set, the
          # "app" target in tauri.conf.json bundle.targets refuses to
          # produce .app.tar.gz + .sig — set both secrets before cutting
          # the first tag after this lands.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tauri project lives at apps/desktop after the monorepo Phase 2
          # migration. tauri-action looks for src-tauri/ relative to
          # projectPath. Cargo output lands at <projectPath>/target/ from
          # here because Cargo.toml also lives at apps/desktop/.
          projectPath: apps/desktop
          # Pin the build runner instead of letting tauri-action detect it.
          #
          # Detection picks a package manager by walking up from projectPath
          # looking for a lockfile, then runs `<pm> run tauri`. In this
          # monorepo the only lockfile is the root bun.lock while projectPath
          # is apps/desktop, and the v0 action resolved that to npm and ran
          # `npm run tauri build`, which fails because apps/desktop has no
          # `tauri` script:
          #
          #   npm error Missing script: "tauri"
          #   npm error workspace @agent-terminal/desktop
          #
          # Setting tauriScript skips detection entirely and runs exactly
          # this command, which is also what `bun run tauri:build` does
          # locally, so CI and laptop agree.
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}

      - name: Add stable-named DMG copies
        # The README pins its download badges to:
        #   /releases/latest/download/agent-terminal-{aarch64,x64}.dmg
        # That redirect resolves to the asset on whichever release is marked
        # "Latest" — but only if the filename is stable across releases.
        # The bundler-produced names (`Agent Terminal_0.1.4_aarch64.dmg`)
        # change every version, so we ship side-by-side copies with
        # versionless names. Keeps both audiences happy: the version-stamped
        # download for the release page, the stable filename for the README.
        run: |
          set -euo pipefail
          cd apps/desktop/target/${{ matrix.target }}/release/bundle/dmg
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) STABLE=agent-terminal-aarch64.dmg ;;
            x86_64-apple-darwin)  STABLE=agent-terminal-x64.dmg ;;
            *) echo "Unknown target ${{ matrix.target }}"; exit 1 ;;
          esac
          src=$(ls *.dmg | head -n 1)
          cp -- "$src" "$STABLE"
          ls -la

      - name: Suffix updater bundle with arch
        # Tauri appends `_aarch64` / `_x64` to DMG filenames automatically
        # but does NOT do the same for `.app.tar.gz` — both matrix entries
        # produce `<ProductName>.app.tar.gz`. Two consequences:
        #   1. GitHub Releases reject a second asset with a duplicate name,
        #      so only one tarball would attach to the draft release.
        #   2. The manifest script can't tell the arches apart by filename.
        # Rename here so downstream steps (upload, release attach, manifest
        # generation) can all rely on a stable arch suffix.
        run: |
          set -euo pipefail
          cd apps/desktop/target/${{ matrix.target }}/release/bundle/macos
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
            *) echo "Unknown target ${{ matrix.target }}"; exit 1 ;;
          esac
          for f in *.app.tar.gz; do
            base="${f%.app.tar.gz}"
            # Tauri's bundler uses productName verbatim — e.g. for
            # "Agent Terminal" it produces "Agent Terminal.app.tar.gz" with
            # a literal space. GitHub Releases stores the asset fine but
            # silently rewrites spaces to dots in the served URL path
            # (`Agent.Terminal_…app.tar.gz`), so a manifest URL built from
            # the spaced on-disk name 404s when the updater fetches it.
            # Normalize here so the on-disk filename, the uploaded asset,
            # and the manifest URL all agree on dotted form.
            base="${base// /.}"
            mv -- "$f"     "${base}_${ARCH}.app.tar.gz"
            mv -- "$f.sig" "${base}_${ARCH}.app.tar.gz.sig"
          done
          ls -la

      - name: Upload .dmg + updater bundle as workflow artifact
        # Hands every release artifact for this arch off to the `release`
        # job (Linux runner, can't reach into this macOS runner's
        # filesystem directly). Short retention because everything also
        # lands on the GitHub Release within minutes — workflow artifacts
        # are a job-to-job carrier, not a long-term archive.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundles-${{ matrix.target }}
          path: |
            apps/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  # Job 3: create the draft release with BOTH .dmgs attached. Lives
  # outside the matrix because softprops/action-gh-release running inside
  # the matrix would create two separate releases (one per matrix entry)
  # and the second would 422 because the tag already has a release.
  # Linux runner — this job just downloads artifacts + POSTs to the API.
  release:
    name: Create draft release
    needs: [changelog, build, linux]
    runs-on: ubuntu-latest
    # Writes twice: softprops/action-gh-release creates the draft release, and
    # peaceiris/actions-gh-pages pushes latest.json to the release-manifest
    # branch. No other job in this workflow writes to the repository.
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundles-*
          path: artifacts
          # `merge-multiple` flattens the per-matrix subdirectories so
          # the final `files:` glob doesn't need a level of indirection.
          merge-multiple: true

      - name: Generate latest.json manifest
        # Discovers asset filenames from the downloaded artifacts so the
        # script doesn't have to predict Tauri's productName-to-filename
        # sanitisation (current bundler converts "Agent Terminal" →
        # "Agent.Terminal" in DMGs; .app.tar.gz follows the same shape).
        # The URLs embedded in the manifest use the basenames of the
        # discovered files, which is what GitHub serves as
        # /releases/download/<tag>/<basename>.
        #
        # `find` (not a flat ls) because upload-artifact@v4 strips only the
        # longest common parent of the uploaded paths — here that's
        # `release/bundle/`, so files land under `artifacts/dmg/...` and
        # `artifacts/macos/...` after download, not flat in `artifacts/`.
        run: |
          set -euo pipefail
          mkdir -p manifest
          VERSION="${GITHUB_REF_NAME#v}"

          AARCH64_TAR=$(find artifacts -type f -name '*aarch64*.app.tar.gz' | head -n 1)
          X64_TAR=$(find artifacts -type f -name '*x64*.app.tar.gz' | head -n 1)
          AARCH64_BASENAME=$(basename "${AARCH64_TAR}")
          X64_BASENAME=$(basename "${X64_TAR}")
          AARCH64_SIG=$(cat "${AARCH64_TAR}.sig")
          X64_SIG=$(cat "${X64_TAR}.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${RELEASE_NOTES}" \
            --arg pub_date "${PUB_DATE}" \
            --arg aarch64_sig "${AARCH64_SIG}" \
            --arg aarch64_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${AARCH64_BASENAME}" \
            --arg x64_sig "${X64_SIG}" \
            --arg x64_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${X64_BASENAME}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $aarch64_sig, url: $aarch64_url },
                "darwin-x86_64":  { signature: $x64_sig,     url: $x64_url     }
              }
            }' > manifest/latest.json

          echo "Generated latest.json:"
          cat manifest/latest.json
        env:
          RELEASE_NOTES: ${{ needs.changelog.outputs.content }}

      - name: Create draft release with .dmgs + updater bundles + manifest
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # DRAFT — never auto-publish. The user reviews the body, edits
          # if needed, and clicks Publish in the GitHub UI.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.content }}
          # Attach .dmg (installs), .app.tar.gz (updater payload),
          # .app.tar.gz.sig (minisign signature), and latest.json (the
          # manifest — duplicated here as an audit copy of what was
          # published to the release-manifest branch).
          #
          # `artifacts/**/*` because upload-artifact@v4 preserves the
          # per-arch `dmg/` and `macos/` subdirectories (longest common
          # parent of the uploaded paths is `release/bundle/`).
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            manifest/latest.json
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.snap
          fail_on_unmatched_files: true

      - name: Publish manifest to release-manifest branch
        if: ${{ !contains(github.ref_name, '-') }}
        # Sidesteps GitHub's /releases/latest/download/ redirect (which
        # excludes pre-releases). The manifest is served at:
        #
        #   https://raw.githubusercontent.com/${{ github.repository }}/release-manifest/latest.json
        #
        # raw.githubusercontent.com caches for ~5 min — installed apps
        # see new releases within that window. The release-manifest
        # branch must exist as an empty orphan branch before the first
        # run; creating it from main would carry the codebase into the
        # manifest branch (handled in the bootstrap step documented
        # alongside this change).
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release-manifest
          publish_dir: ./manifest
          commit_message: "release: ${{ github.ref_name }} manifest"
