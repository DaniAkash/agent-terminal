# Fails when .github/workflows/actions.lock is out of sync with the workflows,
# or when a locked pin no longer verifies against its upstream repository.
#
# Deliberately NOT a job in ci.yml: every job there waits on the `ci-approval`
# manual gate, so a check living in it could not report until a human had
# already approved the run, which is useless as a merge gate. This one runs
# ungated, which is safe because `gh actions-lock --verify` executes no
# repository code at all: it reads the workflow files and queries the API.

name: Verify actions lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  # Manual re-check without a commit. Useful when an upstream branch ref such
  # as dtolnay/rust-toolchain@stable has moved and the lockfile needs relocking.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lock-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pinned: an unpinned extension install would undo the point of the
        # check by running whatever the latest release happens to be.
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gates on the `valid` field rather than the exit code, so the job
        # tracks lockfile validity only. Container images this repo does not
        # control are reported as warnings today, and a future extension
        # version that promoted them to a non-zero exit would otherwise start
        # failing this job for something unrelated to the lockfile.
        run: |
          set -uo pipefail
          verify_exit=0
          gh actions-lock --verify --json=valid,findings > result.json || verify_exit=$?
          if ! jq -e . result.json >/dev/null 2>&1; then
            echo "::error::gh actions-lock wrote no parsable JSON (exit ${verify_exit})"
            exit 1
          fi
          jq -r '.findings[]? | "\(.severity)\t\(.workflow // "-")\t\(.detail)"' result.json
          if ! jq -e '.valid' result.json >/dev/null; then
            echo "::error::lockfile is stale or a locked pin no longer verifies. Run gh actions-lock and commit the result."
            exit 1
          fi
          echo "lockfile verified"
