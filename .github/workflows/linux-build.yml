name: Linux packages

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-desktop-support
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'packaging/**'
      - 'bun.lock'
      - '.github/workflows/linux-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'packaging/**'
      - 'bun.lock'
      - '.github/workflows/linux-build.yml'

permissions:
  contents: read

jobs:
  shell-environments:
    name: Shells (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            family: debian
          - image: ubuntu:24.04
            family: debian
          - image: debian:12
            family: debian
          - image: debian:13
            family: debian
          - image: fedora:latest
            family: fedora
          - image: archlinux:base-devel
            family: arch
    container: ${{ matrix.image }}
    env:
      DISTRO_FAMILY: ${{ matrix.family }}
      CARGO_TARGET_DIR: /tmp/shell-env-target
    steps:
      - name: Install shell test dependencies
        run: |
          case "$DISTRO_FAMILY" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git gcc libc6-dev python3 nodejs bash fish zsh
              ;;
            fedora)
              dnf install -y ca-certificates curl git gcc glibc-devel python3 nodejs bash fish zsh
              ;;
            arch)
              pacman -Syu --noconfirm ca-certificates curl git gcc python nodejs bash fish zsh
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - name: Test production PATH and environment helpers
        run: cargo test --locked --manifest-path apps/desktop/shell-env-tests/Cargo.toml
      - name: Build PTY environment probe
        run: cargo build --locked --manifest-path apps/desktop/shell-env-tests/Cargo.toml
      - name: Test bash, fish and zsh in real PTYs
        run: python3 -E apps/desktop/shell-env-tests/test_pty.py --probe /tmp/shell-env-target/debug/agent-terminal-shell-env-tests

  macos-regression:
    name: macOS shell regression
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
      - run: bun install --frozen-lockfile
      - name: Check macOS startup and environment invariants
        working-directory: apps/desktop
        run: cargo test --locked --lib macos_environment_tests

  packages:
    needs: [shell-environments, macos-regression]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@v4
      - name: Test Linux release packaging
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
      - run: bun install --frozen-lockfile
      - name: Compile the terminal sidecar
        run: bun build apps/desktop/src-tauri/sidecar/index.js --compile --outfile apps/desktop/src-tauri/sidecar/sidecar-bin
      - name: Build Linux packages
        working-directory: apps/desktop
        run: bunx tauri build --config src-tauri/tauri.linux-bundle.conf.json
      - name: Check AppImage contents
        working-directory: apps/desktop
        run: |
          image=$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$image"
          chmod +x "$image"
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-packages
          if-no-files-found: error
          path: |
            apps/desktop/target/release/bundle/appimage/*.AppImage
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/rpm/*.rpm

  appimage-smoke:
    name: AppImage (${{ matrix.image }}, ${{ matrix.backend }})
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', family: debian, backend: x11 }
          - { image: 'ubuntu:24.04', family: debian, backend: x11 }
          - { image: 'debian:12', family: debian, backend: x11 }
          - { image: 'debian:13', family: debian, backend: x11 }
          - { image: 'fedora:latest', family: fedora, backend: x11 }
          - { image: 'archlinux:base-devel', family: arch, backend: x11 }
          - { image: 'ubuntu:22.04', family: debian, backend: wayland }
          - { image: 'ubuntu:24.04', family: debian, backend: wayland }
    container: ${{ matrix.image }}
    env:
      DISTRO_FAMILY: ${{ matrix.family }}
      DISPLAY_BACKEND: ${{ matrix.backend }}
    steps:
      - name: Install desktop runtime dependencies
        run: |
          case "$DISTRO_FAMILY" in
            debian)
              for attempt in 1 2 3; do
                if apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git python3 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xdotool openbox xvfb xauth dbus weston; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Desktop dependency installation failed after $attempt attempts" >&2
                  exit 1
                fi
                echo "Refreshing package indexes before retry $((attempt + 1))"
              done
              ;;
            fedora)
              dnf install -y ca-certificates git python3 webkit2gtk4.1 libayatana-appindicator-gtk3 xdotool openbox xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon weston
              ;;
            arch)
              pacman -Syu --noconfirm ca-certificates git python webkit2gtk-4.1 libayatana-appindicator xdotool openbox xorg-server-xvfb xorg-xauth dbus weston
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-packages
          path: /tmp/linux-packages
      - name: Start AppImage as a regular desktop user
        run: |
          useradd --create-home smoke
          image=$(find /tmp/linux-packages -name '*.AppImage' -print -quit)
          test -n "$image"
          chmod +x "$image"
          runuser -u smoke -- python3 -E apps/desktop/shell-env-tests/smoke_appimage.py --image "$image" --backend "$DISPLAY_BACKEND"
      - name: Install and start native package
        if: matrix.family != 'arch'
        run: |
          case "$DISTRO_FAMILY" in
            debian)
              package=$(find /tmp/linux-packages -name '*.deb' -print -quit)
              apt-get install -y "$package"
              ;;
            fedora)
              package=$(find /tmp/linux-packages -name '*.rpm' -print -quit)
              dnf install -y "$package"
              ;;
          esac
          test -x /usr/bin/agent-terminal
          runuser -u smoke -- python3 -E apps/desktop/shell-env-tests/smoke_appimage.py --binary /usr/bin/agent-terminal --backend "$DISPLAY_BACKEND"
