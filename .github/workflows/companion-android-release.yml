# Tag-triggered signed Android release for the companion app.
#
# Push a `companion-v*` tag (e.g. `companion-v1.0.1`) → this workflow builds
# a signed .aab, uploads it to the Play **internal** track, creates a DRAFT
# GitHub Release for that tag, and attaches the bundle.
#
# The GitHub Release stays in DRAFT state, and Play only ever receives the
# internal track. Both final steps are human: publish the draft from the
# Releases page, promote the track from the Play Console. Nothing here
# reaches the public on its own, which is the same contract the desktop
# release workflow keeps.
#
# How to cut a release:
#   1. Bump version in apps/companion/package.json
#   2. Commit ("chore(release): companion-vX.Y.Z") — the `chore(release)`
#      scope is filtered out by cliff.toml so the version-bump commit does
#      not show up in the next release's changelog.
#   3. git tag companion-vX.Y.Z && git push origin main --tags
#   4. Wait ~25 min, then publish the draft from the Releases page and
#      promote the track in the Play Console
#
# Required repo secrets (settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     — base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD   — unlocks the keystore file
#   ANDROID_KEY_ALIAS           — the key entry inside it
#   ANDROID_KEY_PASSWORD        — unlocks that key entry
#   PLAY_STORE_JSON_KEY         — Play service account JSON, whole file
#
# All values stored in repo Settings → Secrets and variables → Actions.
# Never inline any of them here, even as examples.

name: Companion Release (signed Android build)

on:
  push:
    tags:
      # Scoped to `companion-v…` so the desktop's own `v…` tags, which the
      # other release workflow owns, never start an Android build.
      - 'companion-v[0-9]*'
  # Kept alongside the tag trigger rather than dropped to match the desktop,
  # because it is the only way to reach the dry run: `validate_only` checks
  # the whole Play upload path, signing key included, and commits nothing.
  # That is worth keeping for diagnosing a rejection without burning a
  # versionCode, which Play never lets you reuse.
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to'
        type: choice
        default: internal
        options: [internal, alpha, production, none]
      validate_only:
        description: 'Dry run: validate the upload against Play without publishing'
        type: boolean
        default: false
      build_offset:
        description: 'Added to the derived versionCode, for a respin of the same version'
        default: '0'

# `contents: write` is required for softprops/action-gh-release to create
# the draft release. Everything else stays at default-deny.
permissions:
  contents: write

# Play rejects a versionCode it has already seen, so two concurrent runs of
# the same version would make the second one fail at upload. Queue instead.
concurrency:
  group: companion-release
  cancel-in-progress: false

jobs:
  # Job 1: work out the changelog once, on a free Linux runner, and pass it
  # to the release step as a job output. Doing it inside the build job would
  # mix a cheap git operation into a 25 minute Gradle run for no reason.
  changelog:
    name: Compute changelog
    runs-on: ubuntu-latest
    outputs:
      first_release: ${{ steps.previous_tag.outputs.first_release }}
      # Falls back to the literal string when the step was skipped: the very
      # first companion tag has no ancestor to diff against, and a manual
      # run has no tag at all.
      content: ${{ steps.changelog.outputs.content || 'first release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so git-cliff (and `git describe`) can
          # walk back to the previous tag and compute the changelog range.
          fetch-depth: 0

      - name: Determine previous tag (for changelog range)
        id: previous_tag
        run: |
          # `--match 'companion-v[0-9]*'` keeps the desktop's `v…` tags out
          # of the range. Without it the previous tag would usually be a
          # desktop release and the changelog would cover the wrong window.
          set +e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'companion-v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null)
          set -e
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "first_release=true" >> "$GITHUB_OUTPUT"
            echo "No previous companion tag found — treating as the first release."
          else
            echo "first_release=false" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            echo "Previous tag: $PREVIOUS_TAG"
          fi

      - name: Generate changelog (subsequent releases only)
        if: steps.previous_tag.outputs.first_release == 'false'
        id: changelog
        # Same cliff.toml the desktop release uses, so both changelogs group
        # commits the same way. `--include-path` is the one difference: it
        # restricts the range to commits that touched the companion, so a
        # desktop fix does not appear in mobile release notes.
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --strip header
            --include-path "apps/companion/**"
            ${{ steps.previous_tag.outputs.previous_tag }}..${{ github.ref_name }}

  # Job 2: build and sign the bundle, then hand it to Play's internal track.
  # One runner, no matrix: an .aab carries every ABI, so unlike the desktop
  # there is nothing to build in parallel.
  build:
    name: Build signed bundle
    needs: [changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert the tag matches the version in package.json
        # The cheapest possible place to catch a mistyped tag: before
        # anything is built, rather than as a wrong version string sitting
        # in the Play console.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#companion-v}"
          pkg_version=$(jq -r .version apps/companion/package.json)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${tag_version}, but apps/companion/package.json says ${pkg_version}"
            exit 1
          fi
          echo "version ${pkg_version} confirmed"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Ruby and Fastlane
        # `bundler: latest` rather than the stock bundler, because the
        # committed Gemfile.lock records a newer BUNDLED WITH than the one
        # shipping with this Ruby, and the stock bundler refuses it.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          bundler-cache: true
          working-directory: apps/companion

      - name: Cache Gradle
        # The android/ tree is regenerated by prebuild every run, so build
        # outputs cannot be reused, but the dependency and transform caches
        # can. That is where most of a cold run goes.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-companion-${{ hashFiles('apps/companion/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-companion-

      - name: Install dependencies
        run: bun install

      - name: Run the companion check gate
        # A release is the worst time to discover a type error. Same gate
        # the PR runs, so this should never be the step that fails.
        run: bun run --filter companion check

      - name: Decode signing and Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          set -euo pipefail
          # Both land in RUNNER_TEMP rather than the workspace, so no
          # credential is ever inside a directory git could stage, and
          # nothing here can be destroyed by `expo prebuild --clean`.
          # The signing properties file is written by the Fastlane lane
          # itself, after prebuild has regenerated android/.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play-store-key.json"

      - name: Build and upload
        working-directory: apps/companion
        env:
          PLAY_STORE_JSON_KEY: ${{ runner.temp }}/play-store-key.json
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A tag always goes to internal. A manual run picks its own track,
          # and can tick validate_only for a dry run that checks the whole
          # upload path and commits nothing.
          TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          BUILD_OFFSET: ${{ inputs.build_offset || '0' }}
        run: |
          set -euo pipefail
          if [ "$TRACK" = "none" ]; then
            bundle exec fastlane android build build_offset:"$BUILD_OFFSET"
          elif [ "$VALIDATE_ONLY" = "true" ]; then
            bundle exec fastlane android validate track:"$TRACK" build_offset:"$BUILD_OFFSET"
          else
            bundle exec fastlane android "$TRACK" build_offset:"$BUILD_OFFSET"
          fi

      - name: Upload the bundle as a workflow artifact
        # Carries the bundle to the release job, which runs on a different
        # runner and cannot reach this filesystem. Also keeps the exact
        # artifact inspectable afterwards, which matters when a Play
        # rejection has to be explained.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-aab
          path: apps/companion/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Shred the decoded credentials
        # `always()` so a failed build cannot leave a decoded key behind on
        # a runner that something later in the job might surface.
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upload-keystore.jks" \
                "$RUNNER_TEMP/play-store-key.json" \
                apps/companion/android/keystore.properties

  # Job 3: create the draft release with the bundle attached. Separate from
  # the build so it runs on a free Linux runner that only downloads an
  # artifact and POSTs to the API, and so a manual dispatch cannot create a
  # GitHub Release for a tag that does not exist.
  release:
    name: Create draft release
    needs: [changelog, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: companion-aab
          path: artifacts

      - name: Create draft release with the bundle
        uses: softprops/action-gh-release@v2
        with:
          # DRAFT — never auto-publish. The release is reviewed, edited if
          # needed, and published by hand, exactly as the desktop does.
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.content }}
          files: artifacts/*.aab
          fail_on_unmatched_files: true
