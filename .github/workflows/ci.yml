# PR CI, gated behind manual approval. Also runs on push to main so the
# per-branch caches (Swatinem rust-cache, typeshare-cli) get populated
# under `refs/heads/main`. GitHub Actions cache scope only lets a PR
# restore caches from its own ref or its base branch, so without a main
# cache every new PR pays the cold-compile cost on its first run
# (~5 min of cargo check + test).
#
# The whole check surface runs via one `bun run check` invocation, which
# fans out via `concurrently --group` to every check across the monorepo
# (biome, desktop tsc + test, sidecar test, cargo clippy, cargo test,
# companion's own 7-sub-check chain, and the protocol drift verifier).
# Local and CI parity is the design goal: whatever `bun run check` does
# on a laptop is exactly what CI does. No CI-only steps, no
# laptop-only steps.
#
# One-time setup (otherwise the `approve` gate is a no-op):
#   Repo Settings → Environments → New environment → name `ci-approval`
#   → enable "Required reviewers" → add yourself → save.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Integration branches that stack PRs:
    # - main: production target.
    # - feat/desktop-sidecar-substrate: epic branch for the mobile-companion
    #   server stack. Sub-step PRs target this branch and only land in main
    #   once the whole stack is ready.
    branches:
      - main
      - feat/desktop-sidecar-substrate
  push:
    # Cache-warming trigger only. Main pushes go through PR review already,
    # so re-running the same checks is defensive, not a second gate.
    branches:
      - main
  schedule:
    # Cache-warming trigger only, Mondays at 06:00 UTC. GitHub evicts
    # cache entries that have not been accessed for seven days, and a
    # PR can only restore from its own ref or its base branch. A quiet
    # week on main therefore ages out main's rust-cache entry and the
    # next run, whichever ref it is on, pays the full cold compile:
    # measured at 219s to 342s of excess over a warm run, and that is
    # exactly the state the repo was in when this was investigated,
    # with no rust-cache entry on refs/heads/main at all.
    #
    # Scheduled events run on the default branch, so the approval gate
    # is skipped the same way a push to main skips it, and the run
    # writes a fresh entry under refs/heads/main for PRs to restore.
    # Strictly additive: no existing trigger or step changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    # PR-only gate. On push to main, the merge itself is the review, so
    # the approval step is skipped and downstream jobs run unconditionally
    # via their `if:` guards.
    if: github.event_name == 'pull_request'
    name: Wait for manual approval
    runs-on: ubuntu-latest
    environment: ci-approval
    timeout-minutes: 60
    steps:
      - name: Approved
        run: echo "CI approved by ${{ github.actor }}"

  # Single job runs `bun run check` end-to-end. All prereqs (bun, rust,
  # webkit2gtk apt deps, typeshare-cli, workspace install) set up here,
  # then one invocation fans out to every check in the monorepo.
  check:
    name: Check
    needs: approve
    if: always() && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: '1'
      # apps/desktop/.cargo/config.toml points build-dir at a shared
      # location so local worktrees stop each carrying their own copy of
      # the dependency graph. A runner is a single ephemeral checkout, so
      # it gains nothing from that and would instead split intermediates
      # out of target/, which is the only thing rust-cache below caches
      # and prunes. Overriding back to target/ keeps CI on the layout
      # rust-cache expects.
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pin the toolchain input because rust-cache hashes installed toolchains into its cache key.
      # Version-shaped action refs are prerelease branches, so Dependabot must not manage this action.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: clippy

      # Around 105 packages get pulled from the Ubuntu mirror here, and
      # measured across a month of runs this one step was the largest
      # single consumer of job wall clock: a 31s median, but with a tail
      # where mirror throughput collapsed and a single apt-get ran for
      # 1191s. The package set only changes when the list file changes,
      # so the downloaded .debs are cacheable.
      #
      # Cache key components, all of them load-bearing:
      #   - hash of the package list, so an edited list can never be
      #     served an entry built from the old set.
      #   - ImageOS, which pins the Ubuntu release the .debs belong to.
      # There are deliberately no restore-keys. A partial match would
      # mix .debs from a different package set into the saved entry, and
      # a stale libwebkit2gtk-4.1-dev would be a silent correctness
      # problem, which is worse than the slowness being fixed.
      #
      # The install below is the real backstop. It always runs apt-get
      # update and apt-get install, so it falls back to the network on a
      # miss, and apt only reuses a cached .deb that the freshly fetched
      # index still vouches for by version, size and hash. Anything the
      # index no longer recognises is ignored and re-downloaded.
      #
      # Restore and save are split so the entry is written immediately
      # after the install, before the long check step. A single
      # actions/cache step saves in a post step, which no-ops when the
      # job fails, so every red run would re-download the whole layer.
      - name: Restore Tauri Linux dependency packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt-tauri
          key: apt-tauri-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ hashFiles('.github/tauri-linux-deps.txt') }}

      - name: Install Tauri Linux dependencies
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/apt-tauri
          # Hand apt whatever was restored, then let it decide what is
          # still valid.
          sudo cp -f ~/.cache/apt-tauri/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          mapfile -t packages < <(grep -vE '^[[:space:]]*(#|$)' .github/tauri-linux-deps.txt)
          sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true "${packages[@]}"

      - name: Stage Tauri Linux dependency packages for caching
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf ~/.cache/apt-tauri
          mkdir -p ~/.cache/apt-tauri
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' \
            -exec cp -f {} ~/.cache/apt-tauri/ \;
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/apt-tauri

      - name: Save Tauri Linux dependency packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt-tauri
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace lives at apps/desktop/Cargo.toml with target
          # at apps/desktop/target after the monorepo Phase 2 migration.
          workspaces: apps/desktop -> target
          # Cache third-party crate compiled outputs, not just their
          # sources. Without this, Tauri + wry + portable-pty et al get
          # recompiled from source every run, dominating cargo clippy +
          # test wall time. Cache balloons from ~142 MB to ~1 GB (well
          # under GitHub's 10 GB per-repo cap) but cargo clippy drops to
          # ~10-20s on hit.
          cache-all-crates: true
          # Pin the toolchain that feeds the cache key.
          #
          # rust-cache derives part of its key from `rustup toolchain
          # list`, which reports every toolchain on the runner, not just
          # the one this job uses. That set changes as GitHub rolls new
          # runner images, so identical workflow config can hash to a
          # different key depending on which image a job lands on, and a
          # warm cache becomes a coin flip. Pinning the toolchain (see the
          # dtolnay/rust-toolchain step above) keeps that set stable.
          #
          # Only write an entry from main, which includes the weekly
          # warm run. Every entry is about 1.54 GB, so roughly six fill
          # GitHub's 10 GB per-repo cap, and once the cap is reached
          # GitHub evicts the least recently used entry. Per-pull-request
          # saves were therefore competing with main's entry for the cap,
          # and main's entry is the one every pull request restores from,
          # since a run can only restore from its own ref, its base
          # branch, or the default branch.
          #
          # This trims entry count rather than entry size, because the
          # size turns out not to be trimmable. Measured on this
          # workspace, what is in the entry is almost entirely dependency
          # artifacts: rust-cache already drops the incremental directory,
          # re-extracts the registry sources from the .crate archives
          # instead of storing them, and prunes the workspace crates' own
          # outputs. What is left is the dependency graph, and dropping
          # any of that is what reintroduces cold compiles, which were
          # measured at roughly 5x what the restore costs. So
          # cache-all-crates and cache-targets are deliberately untouched.
          #
          # The trade: a pull request that changes Cargo.lock no longer
          # writes its own entry, so each push to that branch recompiles
          # the changed dependencies rather than restoring them. Bounded
          # to the dependencies that actually changed, and paid only on
          # dependency-changing branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `add-rust-environment-hash-key: false` looks like the direct
          # fix and is what upstream BrowserOS went with, but on
          # rust-cache@v2 that one flag gates BOTH the environment hash
          # AND the Cargo.lock / Cargo.toml hash (src/config.ts:155-261).
          # Disabling it yields a key with no lockfile component, so a
          # dependency bump would silently restore a stale cache. Their
          # live keys show exactly that shape. Not worth the correctness
          # hole for a cache hit.

      - name: Cache typeshare-cli install
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-cli-1.13.4-${{ runner.os }}
          # Persist the cache even when a later step in this job fails.
          # Without this, actions/cache's post-step no-ops on job failure,
          # so any red run leaves the cache empty and the next run rebuilds
          # typeshare-cli from source again (~90s).
          save-always: true

      - name: Install typeshare-cli
        run: |
          if ! command -v typeshare >/dev/null 2>&1; then
            cargo install typeshare-cli --version 1.13.4 --locked
          fi

      - name: bun install
        run: bun install --frozen-lockfile

      # The single monorepo check. Fans out via concurrently --group:
      # biome, desktop:tsc, desktop:test, sidecar:test, rust:clippy,
      # rust:test, companion (which fans out its own 7 sub-checks),
      # and the protocol drift verifier. Every sub-check runs to
      # completion regardless of what others do, so one CI run surfaces
      # every failure at once.
      - name: bun run check
        run: bun run check
