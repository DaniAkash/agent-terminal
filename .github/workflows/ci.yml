# PR CI, gated behind manual approval. Also runs on push to main so the
# per-branch caches (Swatinem rust-cache, typeshare-cli) get populated
# under `refs/heads/main`. GitHub Actions cache scope only lets a PR
# restore caches from its own ref or its base branch, so without a main
# cache every new PR pays the cold-compile cost on its first run
# (~5 min of cargo check + test).
#
# The whole check surface runs via one `bun run check` invocation, which
# fans out via `concurrently --group` to every check across the monorepo
# (biome, desktop tsc + test, sidecar test, cargo clippy, cargo test,
# companion's own 7-sub-check chain, and the protocol drift verifier).
# Local and CI parity is the design goal: whatever `bun run check` does
# on a laptop is exactly what CI does. No CI-only steps, no
# laptop-only steps.
#
# One-time setup (otherwise the `approve` gate is a no-op):
#   Repo Settings → Environments → New environment → name `ci-approval`
#   → enable "Required reviewers" → add yourself → save.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Integration branches that stack PRs:
    # - main: production target.
    # - feat/desktop-sidecar-substrate: epic branch for the mobile-companion
    #   server stack. Sub-step PRs target this branch and only land in main
    #   once the whole stack is ready.
    branches:
      - main
      - feat/desktop-sidecar-substrate
  push:
    # Cache-warming trigger only. Main pushes go through PR review already,
    # so re-running the same checks is defensive, not a second gate.
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    # PR-only gate. On push to main, the merge itself is the review, so
    # the approval step is skipped and downstream jobs run unconditionally
    # via their `if:` guards.
    if: github.event_name == 'pull_request'
    name: Wait for manual approval
    runs-on: ubuntu-latest
    environment: ci-approval
    timeout-minutes: 60
    steps:
      - name: Approved
        run: echo "CI approved by ${{ github.actor }}"

  # Single job runs `bun run check` end-to-end. All prereqs (bun, rust,
  # webkit2gtk apt deps, typeshare-cli, workspace install) set up here,
  # then one invocation fans out to every check in the monorepo.
  check:
    name: Check
    needs: approve
    if: always() && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: '1'
      # apps/desktop/.cargo/config.toml points build-dir at a shared
      # location so local worktrees stop each carrying their own copy of
      # the dependency graph. A runner is a single ephemeral checkout, so
      # it gains nothing from that and would instead split intermediates
      # out of target/, which is the only thing rust-cache below caches
      # and prunes. Overriding back to target/ keeps CI on the layout
      # rust-cache expects.
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned rather than @stable: rust-cache hashes every toolchain the
      # runner reports into its cache key, so a floating toolchain makes
      # the key drift whenever the runner image or upstream stable moves,
      # and every drift is a cold rebuild of the whole dependency graph.
      # Bump deliberately, same as any other dependency.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      # tauri-runtime-wry's build script links against WebKitGTK during
      # dependency compilation — required even for `cargo check`, not just
      # build. Apt list mirrors Tauri 2's prerequisites doc.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace lives at apps/desktop/Cargo.toml with target
          # at apps/desktop/target after the monorepo Phase 2 migration.
          workspaces: apps/desktop -> target
          # Cache third-party crate compiled outputs, not just their
          # sources. Without this, Tauri + wry + portable-pty et al get
          # recompiled from source every run, dominating cargo clippy +
          # test wall time. Cache balloons from ~142 MB to ~1 GB (well
          # under GitHub's 10 GB per-repo cap) but cargo clippy drops to
          # ~10-20s on hit.
          cache-all-crates: true
          # Pin the toolchain that feeds the cache key.
          #
          # rust-cache derives part of its key from `rustup toolchain
          # list`, which reports every toolchain on the runner, not just
          # the one this job uses. That set changes as GitHub rolls new
          # runner images, so identical workflow config can hash to a
          # different key depending on which image a job lands on, and a
          # warm cache becomes a coin flip. Pinning the toolchain (see the
          # dtolnay/rust-toolchain step above) keeps that set stable.
          #
          # `add-rust-environment-hash-key: false` looks like the direct
          # fix and is what upstream BrowserOS went with, but on
          # rust-cache@v2 that one flag gates BOTH the environment hash
          # AND the Cargo.lock / Cargo.toml hash (src/config.ts:155-261).
          # Disabling it yields a key with no lockfile component, so a
          # dependency bump would silently restore a stale cache. Their
          # live keys show exactly that shape. Not worth the correctness
          # hole for a cache hit.

      - name: Cache typeshare-cli install
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-cli-1.13.4-${{ runner.os }}
          # Persist the cache even when a later step in this job fails.
          # Without this, actions/cache's post-step no-ops on job failure,
          # so any red run leaves the cache empty and the next run rebuilds
          # typeshare-cli from source again (~90s).
          save-always: true

      - name: Install typeshare-cli
        run: |
          if ! command -v typeshare >/dev/null 2>&1; then
            cargo install typeshare-cli --version 1.13.4 --locked
          fi

      - name: bun install
        run: bun install --frozen-lockfile

      # The single monorepo check. Fans out via concurrently --group:
      # biome, desktop:tsc, desktop:test, sidecar:test, rust:clippy,
      # rust:test, companion (which fans out its own 7 sub-checks),
      # and the protocol drift verifier. Every sub-check runs to
      # completion regardless of what others do, so one CI run surfaces
      # every failure at once.
      - name: bun run check
        run: bun run check
