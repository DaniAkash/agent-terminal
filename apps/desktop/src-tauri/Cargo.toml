[package]
name = "agent-terminal"
version = "0.3.1"
description = "Agent Terminal — a mouse-first project-scoped terminal workspace"
authors = ["DaniAkash"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "agent_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Switches the running instance to a separate "dev" namespace so a dev build
# can coexist with a production install on the same machine. See src/identity.rs.
dev-instance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Ensures only one Agent Terminal instance runs at a time. Critical on macOS
# for notification click routing: without it, clicking a notification can
# launch a fresh .app process while the original one keeps running. With it,
# Launch Services forwards the duplicate-launch attempt to the existing
# process instead.
tauri-plugin-single-instance = "2"
# Dev-mode banner display only (debug_assertions = true). On macOS in dev this
# attributes notifications to com.apple.Terminal, which is fine for visibility
# but means clicks don't route back to us — see the focus-event heuristic.
tauri-plugin-notification = "2"
# Self-update via signed Tauri update bundles. Disabled at build time in
# the `dev-instance` feature (dev builds share the prod manifest endpoint
# only by accident; letting them auto-update would overlay the prod .app
# onto the dev bundle id).
tauri-plugin-updater = "2"
# Exposes process::relaunch() to the renderer so the update flow can
# boot the new binary after the updater swaps it in.
tauri-plugin-process = "2"
# Release-mode notifications (debug_assertions = false). Wraps the native
# UNUserNotificationCenter on macOS so we get real per-notification click
# callbacks via UNUserNotificationCenterDelegate. Mock mode falls back to
# console logs (used in tests, never in shipped builds).
user-notify = "0.4"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# `ws` feature is needed for the WSS server's `/stream` endpoint. axum-ws
# is a thin wrapper over tokio-tungstenite (which axum-ws pulls in for us)
# — same underlying implementation the master plan sketched, with axum's
# routing / middleware / graceful-shutdown machinery bolted on top.
axum = { version = "0.8", features = ["ws"] }
dirs = "5"
encoding_rs = "0.8"
sysinfo = "0.33"
# Base64 of raw PTY bytes for the sidecar's JSON-RPC channel. JSON can't carry
# arbitrary binary cleanly, so every `write` op encodes the chunk and the
# sidecar decodes on receipt.
base64 = "0.22"
# Structured errors for the sidecar client. Keeps the call sites (`?`-able)
# tight without hand-rolling Display/source plumbing.
thiserror = "2"
# PATH walk for the bundled-Node fallback at runtime. Production builds will
# eventually carry a Node binary inside the .app bundle; until then, dev
# launches look the runtime up from the system.
which = "8"
# Sharded concurrent map for the StreamHub's per-tab state. Many reader
# threads broadcast concurrently across different tabs; a single Mutex
# would serialise unrelated tabs through the lock.
dashmap = "6"
# Attribute macros for the wire-protocol types. `cargo xtask regen-protocol`
# picks up every `#[typeshare]`-annotated type and emits the matching TS
# discriminated-union file under `companion/src/modules/wss/protocol.gen.ts`.
typeshare = "1"
# Constant-time token comparison for the WSS auth stub. Prevents timing
# attacks even in dev mode — cheap defence-in-depth over `==` on bytes.
constant_time_eq = "0.3"
# Random token generation for the initial dev config file. v4 UUIDs give
# ~122 bits of entropy which is plenty for a Phase-1 bearer token.
uuid = { version = "1", features = ["v4"] }
# Self-signed TLS cert generation for the WSS server. First launch creates
# a cert + key pair; subsequent launches reload from disk. Mobile clients
# pin the SHA-256 fingerprint (embedded in the pairing QR).
rcgen = "0.14"
# TLS termination for the WSS server. axum-server wraps axum::serve so the
# WebSocket upgrade path takes rustls without a rewrite; tokio-rustls
# provides the underlying TLS runtime.
axum-server = { version = "0.7", features = ["tls-rustls"] }
# `ring` (over `aws-lc-rs`) as the crypto backend so rustls doesn't panic
# with "Could not automatically determine the process-level CryptoProvider"
# on first use. `ring` is the historical rustls default; smaller binary,
# no C compiler at build time on macOS.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# PEM parsing for the cert + key loaded from disk into rustls types.
rustls-pemfile = "2"
# SHA-256 of the cert's DER bytes, formatted uppercase-hex colon-separated
# to match `openssl x509 -fingerprint -sha256`. This value is what the
# mobile client pins.
sha2 = "0.10"
# Structured error type used by the tls module. anyhow gives us `?` chains
# without hand-rolling Display/source on every variant.
anyhow = "1"
# Enumerate the machine's network interfaces so the self-signed TLS
# cert can include the actual LAN IPs the mobile client will reach via
# `wss://<lan-ip>:47823`. Without matching IP SANs the client-side TLS
# verification fails even when the cert itself is trusted; on iOS this
# was accidentally masked by NSAllowsLocalNetworking bypassing the
# validation entirely on local destinations.
local-ip-address = "0.6.13"
# Native platform secret storage for the paired-devices map. macOS Keychain
# on darwin, DPAPI/Windows-Native-Keyring on Windows, Secret Service on
# Linux. No argon2 master password prompt (unlike tauri-plugin-stronghold);
# unlocks silently when the user is logged in. Stores a single JSON blob
# of `HashMap<device_id, PairedDevice>` under a fixed service+account.
# The `v1` feature enables the classic `Entry::new` / `get_password` /
# `set_password` API. The new `cli` feature exposes a lower-level
# multi-backend selector that we don't need for one blob.
keyring = { version = "4.1.4", features = ["v1"] }
# mDNS / DNS-SD service registration for `_agent-terminal._tcp.local.`
# so mobile clients can find the desktop by its `.local` name after an
# IP change on the same LAN. Pure-Rust, no C deps, cross-platform.
mdns-sd = "0.20.1"
# Reads the machine's OS hostname. macOS "Local Hostname" (System
# Preferences → Sharing) is the authoritative name; the crate returns
# it verbatim on macOS. On Linux/Windows it returns whatever the
# system's `gethostname()` returns.
hostname = "0.4.2"

[dev-dependencies]
# Isolated temp directories for auth_stub round-trip tests.
tempfile = "3"
# WebSocket client for the wss_server integration tests. Version pinned
# to match what axum 0.8's `ws` feature pulls in transitively — avoids
# two tungstenite stacks in the build. The rustls feature exposes
# `Connector::Rustls`; the wss_tls_integration test brings its own root
# store, so webpki-roots vs native-roots doesn't matter here.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# Stream/Sink extension traits needed for tokio-tungstenite's split
# WebSocket handles.
futures-util = "0.3"

